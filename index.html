<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>my memories ♡</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#fff9fb;
  --pink:#f5dce5;
  --pink2:#fff2f6;
  --border:#efd2de;
  --text:#634f59;
  --muted:#9e8992;
  --danger:#a85d74;
  --shadow:0 10px 28px rgba(99,79,89,.08)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:linear-gradient(#fffafd,#fff);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.page{
  max-width:1500px;
  margin:auto;
  padding:28px 24px 70px
}

.header{
  text-align:center;
  padding:8px 10px 22px
}

.header h1{
  margin:0;
  font:500 clamp(32px,4vw,50px) Georgia,serif;
  color:#6b5460
}

.header p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:13px
}

.actions,
.sections,
.sort{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap
}

.actions{
  justify-content:center;
  margin-bottom:16px
}

.sections{
  justify-content:flex-start;
  margin-bottom:14px;
  width:100%
}

button,
select,
input,
textarea{
  font:inherit
}

.btn{
  border:1px solid var(--border);
  border-radius:999px;
  padding:9px 15px;
  background:#fff;
  color:#765766;
  cursor:pointer
}

.btn.primary{
  background:var(--pink)
}

.btn:hover{
  transform:translateY(-1px)
}

.btn:disabled{
  opacity:.6;
  cursor:default;
  transform:none
}

.admin-only{
  display:none
}

.tab{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:4px 6px 4px 12px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#fff
}

.tab.active{
  background:var(--pink2)
}

.tab button{
  border:0;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  font-size:12px;
  padding:5px 3px
}

.remove-section{
  display:none;
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:16px;
  padding:2px 6px;
  border-radius:50%
}

.remove-section:hover{
  background:var(--pink2);
  color:var(--danger)
}

body.admin .remove-section{
  display:block
}

.sort{
  justify-content:center;
  margin-bottom:24px;
  color:var(--muted);
  font-size:12px
}

.sort select{
  border:1px solid var(--border);
  border-radius:12px;
  padding:7px 10px;
  background:#fff;
  color:var(--text)
}

.heading{
  text-align:center;
  margin-bottom:18px
}

.heading h2{
  margin:0;
  font:500 24px Georgia,serif
}

.heading p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px;
  white-space:pre-wrap
}

.gallery{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(10px,1.4vw,18px);
  align-items:start;
  justify-items:start
}

.card{
  background:#fff;
  border:1px solid rgba(239,210,222,.65);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  width:100%
}

.media{
  width:100%;
  overflow:hidden;
  background:#fff
}

.media img,
.media video{
  display:block;
  max-width:100%;
  height:auto
}

.media img{
  width:auto;
  margin:0 auto;
  cursor:zoom-in
}

.media video{
  width:100%;
  background:#000
}

.info{
  padding:11px 13px 13px
}

.date{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.07em;
  color:var(--muted);
  margin-bottom:5px
}

.location{
  font-size:11px;
  color:#987682;
  margin-bottom:6px
}

.caption{
  font:14px/1.5 Georgia,serif;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.card-actions{
  display:none;
  justify-content:flex-end;
  padding:0 10px 10px
}

body.admin .card-actions{
  display:flex
}

.delete-memory{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:11px
}

.empty{
  grid-column:1/-1;
  width:100%;
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
  font:14px Georgia,serif
}

/* MODALS */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(45,30,37,.55);
  backdrop-filter:blur(5px);
  z-index:1000
}

.modal.open{
  display:flex
}

.modal-card{
  position:relative;
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  padding:24px;
  background:#fff;
  border-radius:22px;
  box-shadow:0 24px 80px rgba(0,0,0,.2)
}

.modal-card h2{
  margin:0 0 5px;
  font:500 24px Georgia,serif
}

.sub{
  margin:0 0 18px;
  color:var(--muted);
  font-size:12px
}

.close{
  position:absolute;
  right:14px;
  top:12px;
  border:0;
  border-radius:50%;
  width:34px;
  height:34px;
  background:var(--pink2);
  color:var(--text);
  font-size:20px;
  cursor:pointer
}

.field{
  margin-bottom:14px
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
  font-weight:600
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  color:var(--text)
}

.field textarea{
  min-height:95px;
  resize:vertical
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px
}

.status{
  display:none;
  padding:9px 11px;
  margin-bottom:14px;
  border-radius:10px;
  background:var(--pink2);
  color:var(--muted);
  font-size:12px
}

/* LIGHTBOX */

.lightbox{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(25,18,22,.82);
  z-index:1200
}

.lightbox.open{
  display:flex
}

.lb-inner{
  position:relative;
  max-width:96vw;
  max-height:95vh;
  background:#111;
  border-radius:18px;
  overflow:hidden
}

.lb-inner img,
.lb-inner video{
  display:block;
  max-width:94vw;
  max-height:82vh;
  width:auto;
  height:auto;
  background:#111
}

.lb-caption{
  padding:10px 14px;
  background:#fff;
  color:var(--text);
  font-size:12px;
  white-space:pre-wrap
}

/* ADMIN EDIT TOOLS */

.extra-memory-tools{
  display:none;
  flex-wrap:wrap;
  gap:5px;
  padding:0 10px 10px;
  justify-content:flex-start
}

body.admin .extra-memory-tools{
  display:flex
}

.extra-memory-tools button,
.extra-section-tools button{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  cursor:pointer
}

.extra-memory-tools button:hover,
.extra-section-tools button:hover{
  background:var(--pink2)
}

body.admin .card{
  cursor:grab
}

.memory-dragging,
.section-dragging{
  opacity:.45
}

.extra-section-tools{
  display:none;
  align-items:center;
  gap:2px;
  margin-left:2px
}

body.admin .extra-section-tools{
  display:flex
}

.extra-section-tools button{
  padding:3px 7px;
  font-size:10px
}

body.admin .tab{
  cursor:grab
}

/* EDIT BOX */

#extraEditBox{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(45,30,37,.55);
  backdrop-filter:blur(5px)
}

#extraEditBox.open{
  display:flex
}

#extraEditBox .extra-edit-card{
  width:min(500px,100%);
  background:#fff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 24px 80px rgba(0,0,0,.2)
}

#extraEditBox h2{
  margin:0 0 5px;
  font:500 24px Georgia,serif;
  color:var(--text)
}

#extraEditBox p{
  margin:0 0 18px;
  color:var(--muted);
  font-size:12px
}

#extraEditBox label{
  display:block;
  margin:12px 0 6px;
  font-size:12px;
  font-weight:600
}

#extraEditBox input,
#extraEditBox textarea{
  width:100%;
  box-sizing:border-box;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 12px;
  color:var(--text);
  background:#fff;
  font:inherit
}

#extraEditBox textarea{
  min-height:100px;
  resize:vertical
}

.extra-edit-buttons{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px
}

.extra-edit-buttons button{
  border:1px solid var(--border);
  border-radius:999px;
  padding:9px 15px;
  background:#fff;
  color:var(--text);
  cursor:pointer
}

.extra-edit-buttons .save-extra{
  background:var(--pink)
}

/* =========================================================
   LYSS ONLINE STATUS
   ========================================================= */

#lyss-presence{
  position:fixed;
  top:18px;
  right:24px;
  z-index:9998;

  display:flex;
  align-items:center;
  gap:9px;

  padding:10px 16px;

  background:rgba(255,255,255,.94);
  border:1px solid var(--border);
  border-radius:999px;

  box-shadow:0 8px 25px rgba(99,79,89,.08);

  color:#765766;
  font-size:12px;

  backdrop-filter:blur(8px);

  transition:opacity .2s ease
}

#lyss-presence-heart{
  font-family:Georgia,serif;
  font-size:22px;
  line-height:1;
  display:inline-block;
  transform-origin:center;
  color:#a85d74
}

#lyss-presence.online #lyss-presence-heart{
  animation:lyssHeartPulse 1.2s ease-in-out infinite
}

#lyss-presence.offline #lyss-presence-heart{
  opacity:.55
}

#lyss-presence-text{
  white-space:nowrap
}

@keyframes lyssHeartPulse{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.25)
  }
}

@media(max-width:950px){
  .gallery{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
}

@media(max-width:560px){

  .page{
    padding-left:9px;
    padding-right:9px
  }

  .gallery{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px
  }

  .card{
    border-radius:14px
  }

  .info{
    padding:9px 10px 11px
  }

  #lyss-presence{
    top:12px;
    right:12px;
    padding:8px 12px;
    font-size:11px
  }

  #lyss-presence-heart{
    font-size:19px
  }
}
</style>
</head>

<body>

<!-- =========================================================

<div class="modal" id="sectionModal">

<!-- =========================================================

<div class="lightbox" id="lightbox">

<script>
/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://jaubryfyktdfzxqbrzue.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_qNcbkgifCJVk0cX7A7oRXg_AtlSlAld";

const ADMIN_UID =
  "dabf4e39-9760-4041-be58-b6a6c42e0351";

const MEMORIES_TABLE = "memories";
const SECTIONS_TABLE = "sections";
const STORAGE_BUCKET = "gallery";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   GLOBAL STATE
   ========================================================= */

let currentUser = null;
let sections = [];
let activeSectionId = null;
let sortMode = "newest";


/* =========================================================
   HELPERS
   ========================================================= */

const $ = id =>
  document.getElementById(id);


function admin(){
  return !!currentUser &&
         currentUser.id === ADMIN_UID;
}


function openModal(id){
  $(id).classList.add("open");
}


function closeModal(id){
  $(id).classList.remove("open");
}


/* Close buttons */

document
  .querySelectorAll("[data-close]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => closeModal(button.dataset.close)
    );

  });


/* =========================================================
   ADMIN UI
   ========================================================= */

function updateAdminUI(){

  document.body.classList.toggle(
    "admin",
    admin()
  );

  document
    .querySelectorAll(".admin-only")
    .forEach(element => {

      element.style.display =
        admin()
          ? "inline-flex"
          : "none";

    });

}


/* =========================================================
   DATE
   ========================================================= */

function formatDate(value){

  if(!value) return "";

  const s =
    String(value).trim();

  if(
    /^\d{4}-\d{2}-\d{2}$/.test(s)
  ){

    const [y,m,d] =
      s.split("-").map(Number);

    return new Date(
      y,
      m - 1,
      d
    ).toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );

  }

  const parsed =
    Date.parse(s);

  if(Number.isNaN(parsed)){
    return s;
  }

  return new Date(parsed)
    .toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );

}


function sortValue(value){

  if(!value) return null;

  const s =
    String(value).trim();

  if(
    /^\d{4}-\d{2}-\d{2}$/.test(s)
  ){

    return Number(
      s.replaceAll("-","")
    );

  }

  const t =
    Date.parse(s);

  return Number.isNaN(t)
    ? null
    : t;

}


/* =========================================================
   MEMORY SORTING
   ========================================================= */

function sortMemories(rows){

  return [...rows].sort((a,b)=>{

    if(sortMode === "recently_added"){

      return new Date(
        b.created_at || 0
      ) -
      new Date(
        a.created_at || 0
      );

    }

    const da =
      sortValue(a.date);

    const dbv =
      sortValue(b.date);

    if(
      da === null &&
      dbv === null
    ){

      return new Date(
        b.created_at || 0
      ) -
      new Date(
        a.created_at || 0
      );

    }

    if(da === null) return 1;
    if(dbv === null) return -1;

    return sortMode === "oldest"
      ? da - dbv
      : dbv - da;

  });

}


/* =========================================================
   STORAGE URL
   ========================================================= */

function publicUrl(path){

  if(!path) return "";

  if(
    /^https?:\/\//i.test(path)
  ){
    return path;
  }

  return db
    .storage
    .from(STORAGE_BUCKET)
    .getPublicUrl(path)
    .data
    .publicUrl;

}


/* =========================================================
   LOCAL DRAG ORDER
   ========================================================= */

function storageKey(type, sectionId){

  return (
    "lyss_" +
    type +
    "_" +
    (sectionId || "all")
  );

}


function getSavedOrder(type, sectionId){

  try{

    return JSON.parse(
      localStorage.getItem(
        storageKey(type,sectionId)
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveOrder(
  type,
  sectionId,
  ids
){

  localStorage.setItem(
    storageKey(type,sectionId),
    JSON.stringify(ids)
  );

}


function applySavedOrder(
  items,
  type,
  sectionId
){

  const saved =
    getSavedOrder(
      type,
      sectionId
    );

  if(!saved.length){
    return items;
  }

  const position =
    new Map(
      saved.map(
        (id,index) =>
          [String(id),index]
      )
    );

  return [...items].sort(
    (a,b)=>{

      const pa =
        position.has(String(a.id))
          ? position.get(String(a.id))
          : 999999;

      const pb =
        position.has(String(b.id))
          ? position.get(String(b.id))
          : 999999;

      return pa - pb;

    }
  );

}


/* =========================================================
   HEADING
   ========================================================= */

function renderHeading(){

  if(activeSectionId === null){

    $("heading").innerHTML = "";

    return;

  }

  const section =
    sections.find(
      x => x.id === activeSectionId
    );

  if(!section){

    activeSectionId = null;

    renderHeading();

    return;

  }

  $("heading").innerHTML = "";

  const h =
    document.createElement("h2");

  h.textContent =
    section.title;

  $("heading").appendChild(h);

  if(section.subtitle){

    const p =
      document.createElement("p");

    p.textContent =
      section.subtitle;

    $("heading").appendChild(p);

  }

}


/* =========================================================
   SECTIONS
   ========================================================= */

function renderSections(){

  const nav =
    $("sectionsNav");

  nav.innerHTML = "";


  /* All memories */

  const all =
    document.createElement("div");

  all.className =
    "tab" +
    (
      activeSectionId === null
        ? " active"
        : ""
    );

  const allButton =
    document.createElement("button");

  allButton.textContent =
    "all memories ♡";

  allButton.addEventListener(
    "click",
    async ()=>{

      activeSectionId = null;

      renderSections();

      await loadGallery();

    }
  );

  all.appendChild(allButton);

  nav.appendChild(all);


  /* Sections */

  sections.forEach(section => {

    const wrap =
      document.createElement("div");

    wrap.className =
      "tab" +
      (
        activeSectionId === section.id
          ? " active"
          : ""
      );

    wrap.dataset.sectionId =
      section.id;


    const pick =
      document.createElement("button");

    pick.textContent =
      section.title;

    pick.addEventListener(
      "click",
      async ()=>{

        activeSectionId =
          section.id;

        renderSections();

        await loadGallery();

      }
    );

    wrap.appendChild(pick);


    const remove =
      document.createElement("button");

    remove.className =
      "remove-section";

    remove.type =
      "button";

    remove.title =
      "Remove section";

    remove.textContent =
      "×";

    remove.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        removeSection(section);

      }
    );

    wrap.appendChild(remove);


    nav.appendChild(wrap);

  });


  updateAdminUI();

}

/* =========================================================

   ========================================================= */

async function loadSections(){

  const result =
    await db
      .from(SECTIONS_TABLE)
      .select(
        "id,title,subtitle,created_at"
      )
      .order(
        "created_at",
        {ascending:true}
      );

  if(result.error){

    console.error(
      "Sections:",
      result.error
    );

    sections = [];

  }else{

    sections =
      result.data || [];

  }


  /* Apply saved section order */

  sections =
    applySavedOrder(
      sections,
      "sections",
      "main"
    );


  renderSections();

  populateSectionSelect();

  renderHeading();

}


/* =========================================================
   LOAD GALLERY
   ========================================================= */

async function loadGallery(){

  renderHeading();

  const gallery =
    $("gallery");

  gallery.innerHTML =
    '<div class="empty">loading memories ♡</div>';


  let query =
    db
      .from(MEMORIES_TABLE)
      .select("*");


  if(activeSectionId !== null){

    query =
      query.eq(
        "section_id",
        activeSectionId
      );

  }


  const result =
    await query;


  if(result.error){

    console.error(
      "Gallery:",
      result.error
    );

    gallery.innerHTML =
      '<div class="empty">couldn\'t load memories ♡</div>';

    return;

  }


  let rows =
    sortMemories(
      result.data || []
    );


  rows =
    applySavedOrder(
      rows,
      "memories",
      activeSectionId
    );


  gallery.innerHTML = "";


  if(!rows.length){

    gallery.innerHTML =
      '<div class="empty">no memories here yet ♡</div>';

    return;

  }


  rows.forEach(memory => {

    const card =
      document.createElement("article");

    card.className =
      "card";

    card.dataset.memoryId =
      memory.id;


    /* Media */

    const media =
      document.createElement("div");

    media.className =
      "media";


    const url =
      publicUrl(
        memory.file_path
      );


    const isVideo =
      memory.type === "video" ||
      /\.(mp4|webm|ogg|mov)(\?|$)/i
        .test(
          memory.file_path || ""
        );


    if(isVideo){

      const video =
        document.createElement("video");

      video.src = url;

      video.controls = true;

      video.preload =
        "metadata";

      video.playsInline =
        true;

      media.appendChild(video);

    }else{

      const img =
        document.createElement("img");

      img.src = url;

      img.loading =
        "lazy";

      img.decoding =
        "async";

      img.alt =
        memory.caption ||
        "Memory photo";

      img.addEventListener(
        "click",
        ()=>openLightbox(
          memory,
          false
        )
      );

      media.appendChild(img);

    }


    card.appendChild(media);


    /* Info */

    const info =
      document.createElement("div");

    info.className =
      "info";


    if(memory.date){

      const date =
        document.createElement("div");

      date.className =
        "date";

      date.textContent =
        formatDate(
          memory.date
        );

      info.appendChild(date);

    }


    if(memory.location){

      const location =
        document.createElement("div");

      location.className =
        "location";

      location.textContent =
        "📍 " +
        memory.location;

      info.appendChild(location);

    }


    if(memory.caption){

      const caption =
        document.createElement("div");

      caption.className =
        "caption";

      caption.textContent =
        memory.caption;

      info.appendChild(caption);

    }


    if(info.children.length){

      card.appendChild(info);

    }


    /* Basic delete */

    if(admin()){

      const actions =
        document.createElement("div");

      actions.className =
        "card-actions";


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-memory";

      deleteButton.textContent =
        "delete";

      deleteButton.addEventListener(
        "click",
        ()=>deleteMemory(memory)
      );


      actions.appendChild(
        deleteButton
      );

      card.appendChild(actions);

    }


    gallery.appendChild(card);

  });


  if(admin()){

    setTimeout(
      addMemoryTools,
      20
    );

  }

}


/* =========================================================
   DELETE MEMORY
   ========================================================= */

async function deleteMemory(memory){

  if(!admin()) return;


  if(
    !confirm(
      "Delete this memory and its stored file?"
    )
  ){
    return;
  }


  const result =
    await db
      .from(MEMORIES_TABLE)
      .delete()
      .eq(
        "id",
        memory.id
      );


  if(result.error){

    alert(
      "Couldn't delete the memory ♡\n\n" +
      result.error.message
    );

    return;

  }


  if(memory.file_path){

    const storageResult =
      await db
        .storage
        .from(STORAGE_BUCKET)
        .remove([
          memory.file_path
        ]);

    if(storageResult.error){

      console.error(
        storageResult.error
      );

    }

  }


  await loadGallery();

}


/* =========================================================
   REMOVE SECTION
   ========================================================= */

async function removeSection(section){

  if(!admin()) return;


  if(
    !confirm(
      `Remove "${section.title}"?\n\n` +
      "Its memories will be kept and moved to All Memories."
    )
  ){
    return;
  }


  const moved =
    await db
      .from(MEMORIES_TABLE)
      .update({
        section_id:null
      })
      .eq(
        "section_id",
        section.id
      );


  if(moved.error){

    alert(
      "Couldn't move the memories.\n\n" +
      moved.error.message
    );

    return;

  }


  const removed =
    await db
      .from(SECTIONS_TABLE)
      .delete()
      .eq(
        "id",
        section.id
      );


  if(removed.error){

    alert(
      "Couldn't remove the section.\n\n" +
      removed.error.message
    );

    return;

  }


  if(
    activeSectionId === section.id
  ){

    activeSectionId = null;

  }


  await loadSections();

  await loadGallery();

}

$("saveMemory")
  .addEventListener(
    "click",
    async ()=>{

      if(!admin()) return;


      const file =
        $("memoryFile")
          .files[0];


      if(!file){

        alert(
          "Please choose a photo or video ♡"
        );

        return;

      }


      const button =
        $("saveMemory");


      button.disabled =
        true;

      button.textContent =
        "saving... ♡";


      const sectionId =
        $("memorySection")
          .value || null;

      const date =
        $("memoryDate")
          .value || null;

      const location =
        $("memoryLocation")
          .value
          .trim();

      const caption =
        $("memoryCaption")
          .value
          .trim();

      const type =
        file.type.startsWith("video/")
          ? "video"
          : "image";


      const safeName =
        file.name
          .normalize("NFKD")
          .replace(
            /[^\w.\- ]/g,
            ""
          )
          .replace(
            /\s+/g,
            "-"
          );


      const path =
        `uploads/${crypto.randomUUID()}-${safeName}`;


      const upload =
        await db
          .storage
          .from(STORAGE_BUCKET)
          .upload(
            path,
            file,
            {
              contentType:
                file.type,

              cacheControl:
                "3600",

              upsert:false
            }
          );


      if(upload.error){

        alert(
          "Upload failed ♡\n\n" +
          upload.error.message
        );

        button.disabled =
          false;

        button.textContent =
          "add memory ♡";

        return;

      }


      const insert =
        await db
          .from(MEMORIES_TABLE)
          .insert({
            file_path:path,
            type,
            section_id:sectionId,
            date,
            location,
            caption
          });


      if(insert.error){

        await db
          .storage
          .from(STORAGE_BUCKET)
          .remove([path]);

        alert(
          "Couldn't save the memory ♡\n\n" +
          insert.error.message
        );

        button.disabled =
          false;

        button.textContent =
          "add memory ♡";

        return;

      }


      $("memoryFile").value = "";

      $("memorySection").value = "";

      $("memoryDate").value = "";

      $("memoryLocation").value = "";

      $("memoryCaption").value = "";


      button.disabled =
        false;

      button.textContent =
        "add memory ♡";


      closeModal(
        "memoryModal"
      );


      await loadGallery();

    }
  );

/* =========================================================
   MEMORY EDITING
   ========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[character])
  );

}


function showEditBox(
  title,
  fields,
  saveFunction
){

  document
    .getElementById(
      "extraEditBox"
    )
    ?.remove();


  const overlay =
    document.createElement("div");

  overlay.id =
    "extraEditBox";

  overlay.className =
    "open";


  let fieldsHtml = "";


  fields.forEach(field => {

    if(field.type === "textarea"){

      fieldsHtml += `
        <label>
          ${escapeHtml(field.label)}
        </label>

        <textarea
          id="extraField_${escapeHtml(field.key)}"
        >${escapeHtml(field.value || "")}</textarea>
      `;

    }else{

      fieldsHtml += `
        <label>
          ${escapeHtml(field.label)}
        </label>

        <input
          id="extraField_${escapeHtml(field.key)}"
          type="${escapeHtml(field.type || "text")}"
          value="${escapeHtml(field.value || "")}"
        >
      `;

    }

  });


  overlay.innerHTML = `

    <div class="extra-edit-card">

      <h2>${escapeHtml(title)}</h2>

      <p>edit this little detail ♡</p>

      ${fieldsHtml}

      <div class="extra-edit-buttons">

        <button id="extraCancel">
          cancel
        </button>

        <button
          class="save-extra"
          id="extraSave"
        >
          save ♡
        </button>

      </div>

    </div>
  `;


  document.body.appendChild(
    overlay
  );


  function close(){
    overlay.remove();
  }


  overlay
    .querySelector(
      "#extraCancel"
    )
    .onclick =
      close;


  overlay.addEventListener(
    "click",
    event => {

      if(
        event.target ===
        overlay
      ){

        close();

      }

    }
  );


  overlay
    .querySelector(
      "#extraSave"
    )
    .onclick =
      async ()=>{

        const values = {};


        fields.forEach(field => {

          values[field.key] =
            document
              .getElementById(
                "extraField_" +
                field.key
              )
              .value;

        });


        const button =
          overlay.querySelector(
            "#extraSave"
          );


        button.disabled =
          true;

        button.textContent =
          "saving...";


        try{

          await saveFunction(
            values
          );

          close();

          await loadSections();

          await loadGallery();

        }catch(error){

          console.error(error);

          alert(
            "Couldn't save the changes ♡\n\n" +
            (
              error.message ||
              error
            )
          );

          button.disabled =
            false;

          button.textContent =
            "save ♡";

        }

      };

}

/* =========================================================
   MEMORY ADMIN TOOLS
   ========================================================= */

async function addMemoryTools(){

  if(!admin()) return;


  const gallery =
    $("gallery");


  if(!gallery) return;


  let result =
    await db
      .from(MEMORIES_TABLE)
      .select("*");


  if(result.error){

    console.error(result.error);

    return;

  }


  let memories =
    sortMemories(
      result.data || []
    );


  if(activeSectionId !== null){

    memories =
      memories.filter(
        memory =>
          memory.section_id ===
          activeSectionId
      );

  }


  memories =
    applySavedOrder(
      memories,
      "memories",
      activeSectionId
    );


  const cards =
    [
      ...gallery.querySelectorAll(
        ".card"
      )
    ];


  cards.forEach(
    (card,index)=>{

      const memory =
        memories[index];

      if(!memory) return;


      card.dataset.memoryId =
        memory.id;

      card.draggable =
        true;


      if(
        !card.querySelector(
          ".extra-memory-tools"
        )
      ){

        const tools =
          document.createElement(
            "div"
          );

        tools.className =
          "extra-memory-tools";


        const editButton =
          document.createElement(
            "button"
          );

        editButton.type =
          "button";

        editButton.textContent =
          "✏️ edit";


        editButton.onclick =
          event => {

            event.stopPropagation();

            editMemory(
              memory
            );

          };


        const deleteButton =
          document.createElement(
            "button"
          );

        deleteButton.type =
          "button";

        deleteButton.textContent =
          "🗑️ delete";


        deleteButton.onclick =
          async event => {

            event.stopPropagation();

            await deleteMemory(
              memory
            );

          };


        tools.appendChild(
          editButton
        );

        tools.appendChild(
          deleteButton
        );


        card.appendChild(
          tools
        );

      }


      card.addEventListener(
        "dragstart",
        ()=>{
          card.classList.add(
            "memory-dragging"
          );
        }
      );


      card.addEventListener(
        "dragend",
        ()=>{

          card.classList.remove(
            "memory-dragging"
          );


          const ids =
            [
              ...gallery.querySelectorAll(
                ".card[data-memory-id]"
              )
            ].map(
              item =>
                item.dataset.memoryId
            );


          saveOrder(
            "memories",
            activeSectionId,
            ids
          );

        }
      );


      card.addEventListener(
        "dragover",
        event => {

          event.preventDefault();


          const dragging =
            gallery.querySelector(
              ".memory-dragging"
            );


          if(
            !dragging ||
            dragging === card
          ){
            return;
          }


          const rect =
            card.getBoundingClientRect();


          const before =
            event.clientY <
            rect.top +
            rect.height / 2;


          if(before){

            gallery.insertBefore(
              dragging,
              card
            );

          }else{

            gallery.insertBefore(
              dragging,
              card.nextSibling
            );

          }

        }
      );

    }
  );

}

  const nav =
    $("sectionsNav");


  if(!nav) return;


  const tabs =
    [
      ...nav.querySelectorAll(
        ".tab"
      )
    ];


  const realTabs =
    tabs.slice(1);


  realTabs.forEach(
    (tab,index)=>{

      const section =
        sections[index];


      if(!section) return;


      tab.dataset.sectionId =
        section.id;

      tab.draggable =
        true;


      if(
        tab.querySelector(
          ".extra-section-tools"
        )
      ){
        return;
      }


      const tools =
        document.createElement(
          "span"
        );

      tools.className =
        "extra-section-tools";


      const left =
        document.createElement(
          "button"
        );

      left.type =
        "button";

      left.title =
        "move left";

      left.textContent =
        "←";


      const right =
        document.createElement(
          "button"
        );

      right.type =
        "button";

      right.title =
        "move right";

      right.textContent =
        "→";


      const edit =
        document.createElement(
          "button"
        );

      edit.type =
        "button";

      edit.title =
        "edit";

      edit.textContent =
        "✏️";


      tools.appendChild(left);
      tools.appendChild(right);
      tools.appendChild(edit);


      left.onclick =
        event => {

          event.stopPropagation();


          const currentIndex =
            [...nav.children]
              .indexOf(tab);


          if(currentIndex <= 1){
            return;
          }


          nav.insertBefore(
            tab,
            nav.children[
              currentIndex - 1
            ]
          );


          saveCurrentSectionOrder();

        };


      right.onclick =
        event => {

          event.stopPropagation();


          const currentIndex =
            [...nav.children]
              .indexOf(tab);


          if(
            currentIndex <
              1 ||
            currentIndex >=
              nav.children.length - 1
          ){

            return;

          }


          nav.insertBefore(
            nav.children[
              currentIndex + 1
            ],
            tab
          );


          saveCurrentSectionOrder();

        };


      edit.onclick =
        event => {

          event.stopPropagation();

          editSection(
            section
          );

        };


      tab.appendChild(
        tools
      );


      tab.addEventListener(
        "dragstart",
        ()=>{
          tab.classList.add(
            "section-dragging"
          );
        }
      );


      tab.addEventListener(
        "dragend",
        ()=>{

          tab.classList.remove(
            "section-dragging"
          );

          saveCurrentSectionOrder();

        }
      );


      tab.addEventListener(
        "dragover",
        event => {

          event.preventDefault();


          const dragging =
            nav.querySelector(
              ".section-dragging"
            );


          if(
            !dragging ||
            dragging === tab
          ){
            return;
          }


          const rect =
            tab.getBoundingClientRect();


          const before =
            event.clientX <
            rect.left +
            rect.width / 2;


          if(before){

            nav.insertBefore(
              dragging,
              tab
            );

          }else{

            nav.insertBefore(
              dragging,
              tab.nextSibling
            );

          }

        }
      );

    }
  );

}


function saveCurrentSectionOrder(){

  const nav =
    $("sectionsNav");


  const ids =
    [
      ...nav.querySelectorAll(
        ".tab[data-section-id]"
      )
    ].map(
      tab =>
        tab.dataset.sectionId
    );


  saveOrder(
    "sections",
    "main",
    ids
  );


  sections =
    applySavedOrder(
      sections,
      "sections",
      "main"
    );

}

/* =========================================================
   LYSS ONLINE PRESENCE
   =========================================================

   THIS IS THE IMPORTANT PART.

   - Admin heartbeat: every 20 seconds
   - Online threshold: 60 seconds
   - Visitors check: every 10 seconds
   - If last_seen <= 60 seconds:
       ♥ lyss is online
     with pulsing heart.

   - If last_seen > 60 seconds:
       ♡ lyss was last active X minutes ago
     with a still heart.
   ========================================================= */

const PRESENCE_ID =
  "lyss";

const PRESENCE_ONLINE_SECONDS =
  60;

const PRESENCE_HEARTBEAT_MS =
  20000;

const PRESENCE_CHECK_MS =
  10000;


let presenceWidget = null;
let presenceText = null;
let presenceHeart = null;


/* ---------------------------------------------------------
   CREATE THE ONE AND ONLY PRESENCE WIDGET
   --------------------------------------------------------- */

function createLyssPresence(){

  if(
    document.getElementById(
      "lyss-presence"
    )
  ){

    presenceWidget =
      document.getElementById(
        "lyss-presence"
      );

    presenceText =
      document.getElementById(
        "lyss-presence-text"
      );

    presenceHeart =
      document.getElementById(
        "lyss-presence-heart"
      );

    return;

  }


  const widget =
    document.createElement(
      "div"
    );

  widget.id =
    "lyss-presence";

  widget.className =
    "offline";


  widget.innerHTML = `
    <span id="lyss-presence-heart">♡</span>
    <span id="lyss-presence-text">
      lyss was last active...
    </span>
  `;


  document.body.appendChild(
    widget
  );


  presenceWidget =
    widget;

  presenceText =
    document.getElementById(
      "lyss-presence-text"
    );

  presenceHeart =
    document.getElementById(
      "lyss-presence-heart"
    );

}


/* ---------------------------------------------------------
   DISPLAY ONLINE
   --------------------------------------------------------- */

function showLyssOnline(){

  createLyssPresence();


  presenceWidget.className =
    "online";


  presenceHeart.textContent =
    "♥";


  presenceText.textContent =
    "lyss is online";

}


/* ---------------------------------------------------------
   DISPLAY OFFLINE
   --------------------------------------------------------- */

function showLyssOffline(
  lastSeen
){

  createLyssPresence();


  presenceWidget.className =
    "offline";


  presenceHeart.textContent =
    "♡";


  if(!lastSeen){

    presenceText.textContent =
      "lyss was last active...";

    return;

  }


  const lastTime =
    new Date(
      lastSeen
    ).getTime();


  if(Number.isNaN(lastTime)){

    presenceText.textContent =
      "lyss was last active...";

    return;

  }


  const seconds =
    Math.max(
      0,
      Math.floor(
        (
          Date.now() -
          lastTime
        ) / 1000
      )
    );


  if(seconds < 60){

    presenceText.textContent =
      "lyss was last active just now";

    return;

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes === 1){

    presenceText.textContent =
      "lyss was last active 1 minute ago";

    return;

  }


  if(minutes < 60){

    presenceText.textContent =
      `lyss was last active ${minutes} minutes ago`;

    return;

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours === 1){

    presenceText.textContent =
      "lyss was last active 1 hour ago";

    return;

  }


  if(hours < 24){

    presenceText.textContent =
      `lyss was last active ${hours} hours ago`;

    return;

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days === 1){

    presenceText.textContent =
      "lyss was last active 1 day ago";

    return;

  }


  presenceText.textContent =
    `lyss was last active ${days} days ago`;

}


/* ---------------------------------------------------------
   CHECK LYSS'S STATUS
   --------------------------------------------------------- */

async function updateLyssPresence(){

  createLyssPresence();


  try{

    const result =
      await db
        .from("admin_presence")
        .select("last_seen")
        .eq(
          "id",
          PRESENCE_ID
        )
        .maybeSingle();


    if(result.error){

      console.error(
        "Presence read error:",
        result.error
      );

      return;

    }


    if(
      !result.data ||
      !result.data.last_seen
    ){

      showLyssOffline(
        null
      );

      return;

    }


    const lastSeen =
      new Date(
        result.data.last_seen
      ).getTime();


    const secondsSinceLastSeen =
      (
        Date.now() -
        lastSeen
      ) / 1000;


    /*
     * THE 60 SECOND RULE
     *
     * 60 seconds or less = ONLINE
     * More than 60 seconds = OFFLINE
     */

    if(
      secondsSinceLastSeen <=
      PRESENCE_ONLINE_SECONDS
    ){

      showLyssOnline();

    }else{

      showLyssOffline(
        result.data.last_seen
      );

    }

  }catch(error){

    console.error(
      "Presence error:",
      error
    );

  }

}


/* ---------------------------------------------------------
   ADMIN HEARTBEAT
   --------------------------------------------------------- */

async function lyssHeartbeat(){

  try{

    const sessionResult =
      await db.auth.getSession();


    const user =
      sessionResult
        ?.data
        ?.session
        ?.user;


    /*
     * ONLY THE ADMIN CAN UPDATE
     * LYSS'S ONLINE TIMESTAMP.
     */

    if(
      !user ||
      user.id !== ADMIN_UID
    ){

      return;

    }


    const now =
      new Date()
        .toISOString();


    const result =
      await db
        .from("admin_presence")
        .upsert(
          {
            id:PRESENCE_ID,
            last_seen:now
          },
          {
            onConflict:"id"
          }
        );


    if(result.error){

      console.error(
        "Presence heartbeat error:",
        result.error
      );

      return;

    }


    /*
     * Immediately show online
     * on the admin's own page.
     */

    showLyssOnline();

  }catch(error){

    console.error(
      "Heartbeat error:",
      error
    );

  }

}


/* ---------------------------------------------------------
   START PRESENCE SYSTEM
   --------------------------------------------------------- */

function startLyssPresence(){

  createLyssPresence();


  /*
   * First check.
   */

  updateLyssPresence();


  /*
   * If this browser is the admin,
   * immediately write a heartbeat.
   */

  lyssHeartbeat();


  /*
   * Admin heartbeat every 20 seconds.
   */

  setInterval(
    async ()=>{
      await lyssHeartbeat();
    },
    PRESENCE_HEARTBEAT_MS
  );


  /*
   * Everyone checks Lyss's status
   * every 10 seconds.
   */

  setInterval(
    async ()=>{
      await updateLyssPresence();
    },
    PRESENCE_CHECK_MS
  );

}


/* =========================================================
   VISITOR TRACKING
   ========================================================= */

const VISITOR_KEY =
  "lyss_gallery_visitor_id";

const SESSION_KEY =
  "lyss_gallery_session_id";


const visitorId =
  localStorage.getItem(
    VISITOR_KEY
  ) ||
  crypto.randomUUID();


localStorage.setItem(
  VISITOR_KEY,
  visitorId
);


let sessionId =
  sessionStorage.getItem(
    SESSION_KEY
  );


if(!sessionId){

  sessionId =
    crypto.randomUUID();

  sessionStorage.setItem(
    SESSION_KEY,
    sessionId
  );

}


async function recordVisitor(){

  try{

    const now =
      new Date()
        .toISOString();


    await db
      .from("gallery_visitors")
      .upsert(
        {
          visitor_id:
            visitorId,

          last_seen:
            now
        },
        {
          onConflict:
            "visitor_id"
        }
      );


    const existingResult =
      await db
        .from("gallery_sessions")
        .select(
          "id,started_at,sections_visited"
        )
        .eq(
          "id",
          sessionId
        )
        .maybeSingle();


    const section =
      activeSectionId;


    if(
      existingResult.data
    ){

      const visited =
        Array.isArray(
          existingResult
            .data
            .sections_visited
        )
          ? existingResult
              .data
              .sections_visited
              .slice()
          : [];


      if(
        section &&
        !visited.includes(
          section
        )
      ){

        visited.push(
          section
        );

      }


      await db
        .from("gallery_sessions")
        .update({
          last_seen:
            now,

          current_section_id:
            section,

          sections_visited:
            visited,

          ended_at:null
        })
        .eq(
          "id",
          sessionId
        );

    }else{

      await db
        .from("gallery_sessions")
        .insert({
          id:
            sessionId,

          visitor_id:
            visitorId,

          started_at:
            now,

          last_seen:
            now,

          current_section_id:
            section,

          sections_visited:
            section
              ? [section]
              : [],

          ended_at:null
        });

    }

  }catch(error){

    /*
     * Visitor tracking should NEVER
     * break the gallery if its tables
     * are unavailable.
     */

    console.error(
      "Visitor tracking:",
      error
    );

  }

}


/* =========================================================
   START EVERYTHING
   ========================================================= */

(async function start(){

  /*
   * Create status immediately.
   */

  startLyssPresence();


  /*
   * Record this visitor.
   */

  recordVisitor();


  /*
   * Check current Supabase session.
   */

  const sessionResult =
    await db.auth.getSession();


  currentUser =
    sessionResult
      ?.data
      ?.session
      ?.user ||
    null;


  if(
    currentUser &&
    currentUser.id !== ADMIN_UID
  ){

    await db.auth.signOut();

    currentUser = null;

  }


  updateAdminUI();


  await loadSections();

  await loadGallery();


  if(admin()){

    await lyssHeartbeat();

    refreshAdminTools();

  }

})();


/* =========================================================
   KEEP VISITOR SESSION UPDATED
   ========================================================= */

setInterval(
  recordVisitor,
  30000
);


/* =========================================================
   MARK VISITOR SESSION ENDED
   ========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{
    try{

      if(!sessionId) return;


      /*
       * This is best-effort because browsers
       * can terminate requests during unload.
       */

      db
        .from("gallery_sessions")
        .update({
          ended_at:
            new Date()
              .toISOString()
        })
        .eq(
          "id",
          sessionId
        );

    }catch(error){

      console.error(error);

    }
  }
);

</script>
