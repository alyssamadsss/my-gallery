<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>my gallery ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="site-shell">

    <header class="site-header">
      <div>
        <h1>my gallery ♡</h1>
        <p>photos, videos & little memories</p>
      </div>

      <button id="adminButton" class="admin-button">
        🔒 admin
      </button>
    </header>

    <nav class="navigation" id="navigation">
      <button class="nav-item active">
        all memories ♡
      </button>
    </nav>

    <section class="gallery-controls">

      <div id="adminControls" class="admin-controls hidden">

        <button
          id="addMemoryButton"
          class="primary-button"
        >
          ＋ add a little memory
        </button>

        <button
          id="newSectionButton"
          class="secondary-button"
        >
          ＋ new section
        </button>

        <button
          id="logoutButton"
          class="secondary-button"
        >
          log out
        </button>

      </div>

      <div class="sort-wrapper">

        <label for="sortSelect">
          sort by
        </label>

        <select id="sortSelect">

          <option value="newest">
            Newest first
          </option>

          <option value="oldest">
            Oldest first
          </option>

          <option value="recent">
            Recently added
          </option>

        </select>

      </div>

    </section>

    <main>

      <div
        id="gallery"
        class="gallery"
      ></div>

      <div
        id="emptyState"
        class="empty-state hidden"
      >

        <div class="empty-heart">♡</div>

        <h2>nothing here yet</h2>

        <p>
          Your little memories will appear here.
        </p>

      </div>

    </main>

  </div>


  <!-- LOGIN MODAL -->

  <div
    id="loginModal"
    class="modal hidden"
  >

    <div class="modal-backdrop"></div>

    <div class="modal-card">

      <button
        class="modal-close"
        data-close="loginModal"
      >
        ×
      </button>

      <div class="modal-heading">

        <span>🔒</span>

        <h2>admin</h2>

        <p>
          log in to manage your memories
        </p>

      </div>

      <form id="loginForm">

        <label>
          Email

          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            required
          >

        </label>

        <label>
          Password

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          >

        </label>

        <button
          type="submit"
          class="primary-button full-width"
        >
          log in ♡
        </button>

        <p
          id="loginError"
          class="form-error"
        ></p>

      </form>

    </div>

  </div>


  <!-- ADD MEMORY MODAL -->

  <div
    id="memoryModal"
    class="modal hidden"
  >

    <div class="modal-backdrop"></div>

    <div class="modal-card large-modal">

      <button
        class="modal-close"
        data-close="memoryModal"
      >
        ×
      </button>

      <div class="modal-heading">

        <span>♡</span>

        <h2>add a little memory</h2>

        <p>
          keep a little piece of today
        </p>

      </div>

      <form id="memoryForm">

        <label>
          Photo or video

          <input
            id="memoryFile"
            type="file"
            accept="image/*,video/*"
            required
          >

        </label>

        <label>
          Section

          <select id="memorySection">
            <option value="">
              all memories ♡
            </option>
          </select>

        </label>

        <label>
          Date

          <input
            id="memoryDate"
            type="date"
          >

        </label>

        <label>
          Location

          <input
            id="memoryLocation"
            type="text"
            placeholder="Toronto, Canada"
          >

        </label>

        <label>
          Caption

          <textarea
            id="memoryCaption"
            rows="4"
            placeholder="the sweetest little day ♡"
          ></textarea>

        </label>

        <div
          id="uploadProgress"
          class="upload-progress hidden"
        >
          uploading your memory... ♡
        </div>

        <p
          id="memoryError"
          class="form-error"
        ></p>

        <button
          type="submit"
          class="primary-button full-width"
          id="saveMemoryButton"
        >
          save memory ♡
        </button>

      </form>

    </div>

  </div>


  <!-- NEW SECTION MODAL -->

  <div
    id="sectionModal"
    class="modal hidden"
  >

    <div class="modal-backdrop"></div>

    <div class="modal-card">

      <button
        class="modal-close"
        data-close="sectionModal"
      >
        ×
      </button>

      <div class="modal-heading">

        <span>♡</span>

        <h2>new section</h2>

        <p>
          give your memories a little home
        </p>

      </div>

      <form id="sectionForm">

        <label>
          Section name

          <input
            id="sectionTitle"
            type="text"
            placeholder="summer ♡"
            required
          >

        </label>

        <label>
          Subtitle
          <span class="optional">(optional)</span>

          <input
            id="sectionSubtitle"
            type="text"
            placeholder="little summer memories"
          >

        </label>

        <p
          id="sectionError"
          class="form-error"
        ></p>

        <button
          type="submit"
          class="primary-button full-width"
        >
          create section ♡
        </button>

      </form>

    </div>

  </div>


  <!-- LIGHTBOX -->

  <div
    id="lightbox"
    class="lightbox hidden"
  >

    <button
      id="lightboxClose"
      class="lightbox-close"
    >
      ×
    </button>

    <div
      id="lightboxContent"
      class="lightbox-content"
    ></div>

  </div>


  <div
    id="toast"
    class="toast"
  ></div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>

</body>
</html>
