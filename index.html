<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>my memories ♡</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#fff9fb;
  --pink:#f5dce5;
  --pink2:#fff2f6;
  --border:#efd2de;
  --text:#634f59;
  --muted:#9e8992;
  --danger:#a85d74;
  --shadow:0 10px 28px rgba(99,79,89,.08)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:linear-gradient(#fffafd,#fff);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.page{
  max-width:1500px;
  margin:auto;
  padding:28px 24px 70px
}

/* HEADER */

.header{
  text-align:center;
  padding:8px 10px 22px
}

.header h1{
  margin:0;
  font:500 clamp(32px,4vw,50px) Georgia,serif;
  color:#6b5460
}

.header p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:13px
}

/* BUTTONS */

.actions,
.sections,
.sort{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap
}

.actions{
  justify-content:center;
  margin-bottom:16px
}

.sections{
  justify-content:flex-start;
  margin-bottom:14px;
  width:100%
}

button,
select,
input,
textarea{
  font:inherit
}

.btn{
  border:1px solid var(--border);
  border-radius:999px;
  padding:9px 15px;
  background:#fff;
  color:#765766;
  cursor:pointer;
  transition:.15s ease
}

.btn.primary{
  background:var(--pink)
}

.btn:hover{
  transform:translateY(-1px)
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none
}

.admin-only{
  display:none
}

/* SECTIONS */

.tab{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:4px 6px 4px 12px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#fff;
  transition:.15s ease
}

.tab.active{
  background:var(--pink2)
}

.tab button{
  border:0;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  font-size:12px;
  padding:5px 3px
}

.remove-section{
  display:none;
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:16px;
  padding:2px 6px;
  border-radius:50%
}

.remove-section:hover{
  background:var(--pink2);
  color:var(--danger)
}

body.admin .remove-section{
  display:block
}

/* SORT */

.sort{
  justify-content:center;
  margin-bottom:24px;
  color:var(--muted);
  font-size:12px
}

.sort select{
  border:1px solid var(--border);
  border-radius:12px;
  padding:7px 10px;
  background:#fff;
  color:var(--text)
}

/* HEADING */

.heading{
  text-align:center;
  margin-bottom:18px
}

.heading h2{
  margin:0;
  font:500 24px Georgia,serif
}

.heading p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px;
  white-space:pre-wrap
}

/* GALLERY */

.gallery{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(10px,1.4vw,18px);
  align-items:start;
  justify-items:stretch
}

.card{
  background:#fff;
  border:1px solid rgba(239,210,222,.65);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  min-width:0
}

.media{
  width:100%;
  overflow:hidden;
  background:#fff
}

.media img,
.media video{
  display:block;
  max-width:100%;
  height:auto
}

/*
  Images are NOT cropped or stretched.
  They keep their natural aspect ratio.
*/
.media img{
  width:auto;
  margin:0 auto;
  cursor:zoom-in
}

.media video{
  width:100%;
  background:#000
}

.info{
  padding:11px 13px 13px
}

.date{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.07em;
  color:var(--muted);
  margin-bottom:5px
}

.location{
  font-size:11px;
  color:#987682;
  margin-bottom:6px
}

.caption{
  font:14px/1.5 Georgia,serif;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.card-actions{
  display:none;
  justify-content:flex-end;
  padding:0 10px 10px
}

body.admin .card-actions{
  display:flex
}

.delete-memory{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:11px
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
  font:14px Georgia,serif
}

/* MODALS */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(45,30,37,.55);
  backdrop-filter:blur(5px);
  z-index:1000
}

.modal.open{
  display:flex
}

.modal-card{
  position:relative;
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  padding:24px;
  background:#fff;
  border-radius:22px;
  box-shadow:0 24px 80px rgba(0,0,0,.2)
}

.modal-card h2{
  margin:0 0 5px;
  font:500 24px Georgia,serif
}

.sub{
  margin:0 0 18px;
  color:var(--muted);
  font-size:12px
}

.close{
  position:absolute;
  right:14px;
  top:12px;
  border:0;
  border-radius:50%;
  width:34px;
  height:34px;
  background:var(--pink2);
  color:var(--text);
  font-size:20px;
  cursor:pointer
}

.field{
  margin-bottom:14px
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
  font-weight:600
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  color:var(--text)
}

.field textarea{
  min-height:95px;
  resize:vertical
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px
}

.status{
  display:none;
  padding:9px 11px;
  margin-bottom:14px;
  border-radius:10px;
  background:var(--pink2);
  color:var(--muted);
  font-size:12px
}

/* LIGHTBOX */

.lightbox{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(25,18,22,.82);
  z-index:1200
}

.lightbox.open{
  display:flex
}

.lb-inner{
  position:relative;
  max-width:96vw;
  max-height:95vh;
  background:#111;
  border-radius:18px;
  overflow:hidden
}

.lb-inner img,
.lb-inner video{
  display:block;
  max-width:94vw;
  max-height:82vh;
  width:auto;
  height:auto;
  background:#111
}

.lb-caption{
  padding:10px 14px;
  background:#fff;
  color:var(--text);
  font-size:12px;
  white-space:pre-wrap
}

/* LYSS PRESENCE */

#lyss-presence{
  position:fixed;
  top:18px;
  right:24px;
  z-index:9998;

  display:flex;
  align-items:center;
  gap:9px;

  padding:10px 16px;

  background:rgba(255,255,255,.96);
  border:1px solid var(--border);
  border-radius:999px;

  color:#765766;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:12px;

  box-shadow:0 8px 25px rgba(99,79,89,.08);
  backdrop-filter:blur(8px);

  transition:all .25s ease
}

#lyss-heart{
  font-family:Georgia,serif;
  font-size:24px;
  line-height:1;
  display:inline-block;
  color:#c98da5;
  transform-origin:center
}

#lyss-presence.online #lyss-heart{
  color:#a85d74;
  animation:lyssHeartPulse 1.15s ease-in-out infinite
}

#lyss-presence.offline #lyss-heart{
  opacity:.65
}

#lyss-presence-text{
  white-space:nowrap
}

@keyframes lyssHeartPulse{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.28)
  }
}

/* EXTRA ADMIN TOOLS */

.extra-memory-tools{
  display:none;
  flex-wrap:wrap;
  gap:5px;
  padding:0 10px 10px;
  justify-content:flex-start
}

body.admin .extra-memory-tools{
  display:flex
}

.extra-memory-tools button,
.extra-section-tools button{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  cursor:pointer
}

.extra-memory-tools button:hover,
.extra-section-tools button:hover{
  background:var(--pink2)
}

body.admin .card{
  cursor:grab
}

body.admin .card:active{
  cursor:grabbing
}

.memory-dragging{
  opacity:.45
}

.extra-section-tools{
  display:none;
  align-items:center;
  gap:2px;
  margin-left:2px
}

body.admin .extra-section-tools{
  display:flex
}

.extra-section-tools button{
  padding:3px 7px;
  font-size:10px
}

body.admin .tab{
  cursor:grab
}

.section-dragging{
  opacity:.45
}

/* EDIT BOX */

#extraEditBox{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(45,30,37,.55);
  backdrop-filter:blur(5px)
}

#extraEditBox.open{
  display:flex
}

#extraEditBox .extra-edit-card{
  width:min(500px,100%);
  background:#fff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 24px 80px rgba(0,0,0,.2)
}

#extraEditBox h2{
  margin:0 0 5px;
  font:500 24px Georgia,serif;
  color:var(--text)
}

#extraEditBox p{
  margin:0 0 18px;
  color:var(--muted);
  font-size:12px
}

#extraEditBox label{
  display:block;
  margin:12px 0 6px;
  font-size:12px;
  font-weight:600
}

#extraEditBox input,
#extraEditBox textarea{
  width:100%;
  box-sizing:border-box;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 12px;
  color:var(--text);
  background:#fff;
  font:inherit
}

#extraEditBox textarea{
  min-height:100px;
  resize:vertical
}

#extraEditBox .extra-edit-buttons{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px
}

#extraEditBox button{
  border:1px solid var(--border);
  border-radius:999px;
  padding:9px 15px;
  background:#fff;
  color:var(--text);
  cursor:pointer
}

#extraEditBox .save-extra{
  background:var(--pink)
}

/* RESPONSIVE */

@media(max-width:950px){

  .gallery{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }

}

@media(max-width:560px){

  .page{
    padding-left:9px;
    padding-right:9px
  }

  .gallery{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px
  }

  .card{
    border-radius:14px
  }

  .info{
    padding:9px 10px 11px
  }

  #lyss-presence{
    top:12px;
    right:12px;
    padding:8px 12px;
    font-size:11px
  }

  #lyss-heart{
    font-size:21px
  }
}
</style>
</head>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://jaubryfyktdfzxqbrzue.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_qNcbkgifCJVk0cX7A7oRXg_AtlSlAld";

const ADMIN_UID =
  "dabf4e39-9760-4041-be58-b6a6c42e0351";

const MEMORIES_TABLE = "memories";
const SECTIONS_TABLE = "sections";
const STORAGE_BUCKET = "gallery";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

let currentUser = null;

let sections = [];

let activeSectionId = null;

let sortMode = "newest";


/* =========================================================
   HELPERS
   ========================================================= */

const $ = id =>
  document.getElementById(id);


function admin(){

  return !!currentUser &&
         currentUser.id === ADMIN_UID;

}


function openModal(id){

  $(id).classList.add("open");

}


function closeModal(id){

  $(id).classList.remove("open");

}


/* =========================================================
   MODAL CLOSE BUTTONS
   ========================================================= */

document
  .querySelectorAll("[data-close]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => closeModal(button.dataset.close)
    );

  });


/* =========================================================
   ADMIN UI
   ========================================================= */

function updateAdminUI(){

  document.body.classList.toggle(
    "admin",
    admin()
  );

  document
    .querySelectorAll(".admin-only")
    .forEach(element => {

      element.style.display =
        admin()
          ? "inline-flex"
          : "none";

    });

}


/* =========================================================
   DATE HELPERS
   ========================================================= */

function formatDate(value){

  if(!value) return "";

  const s =
    String(value).trim();

  if(
    /^\d{4}-\d{2}-\d{2}$/.test(s)
  ){

    const [
      y,
      m,
      d
    ] =
      s.split("-").map(Number);

    return new Date(
      y,
      m - 1,
      d
    ).toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );

  }

  const parsed =
    Date.parse(s);

  return Number.isNaN(parsed)
    ? s
    : new Date(parsed).toLocaleDateString(
        undefined,
        {
          year:"numeric",
          month:"long",
          day:"numeric"
        }
      );

}


function sortValue(value){

  if(!value) return null;

  const s =
    String(value).trim();

  if(
    /^\d{4}-\d{2}-\d{2}$/.test(s)
  ){

    return Number(
      s.replaceAll("-","")
    );

  }

  const t =
    Date.parse(s);

  return Number.isNaN(t)
    ? null
    : t;

}


function sortMemories(rows){

  return [...rows].sort(
    (a,b) => {

      if(
        sortMode === "recently_added"
      ){

        return new Date(
          b.created_at || 0
        ) - new Date(
          a.created_at || 0
        );

      }

      const da =
        sortValue(a.date);

      const dbValue =
        sortValue(b.date);

      if(
        da === null &&
        dbValue === null
      ){

        return new Date(
          b.created_at || 0
        ) - new Date(
          a.created_at || 0
        );

      }

      if(da === null) return 1;

      if(dbValue === null) return -1;

      return sortMode === "oldest"
        ? da - dbValue
        : dbValue - da;

    }
  );

}


/* =========================================================
   STORAGE URL
   ========================================================= */

function publicUrl(path){

  if(!path) return "";

  if(
    /^https?:\/\//i.test(path)
  ){

    return path;

  }

  return db
    .storage
    .from(STORAGE_BUCKET)
    .getPublicUrl(path)
    .data
    .publicUrl;

}


/* =========================================================
   SECTION ORDER
   ========================================================= */

function storageKey(
  type,
  sectionId
){

  return (
    "lyss_" +
    type +
    "_" +
    (sectionId || "all")
  );

}


function getSavedOrder(
  type,
  sectionId
){

  try{

    return JSON.parse(
      localStorage.getItem(
        storageKey(type,sectionId)
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveOrder(
  type,
  sectionId,
  ids
){

  localStorage.setItem(
    storageKey(type,sectionId),
    JSON.stringify(ids)
  );

}


function applySavedOrder(
  items,
  type,
  sectionId
){

  const saved =
    getSavedOrder(
      type,
      sectionId
    );

  if(!saved.length){

    return items;

  }

  const position =
    new Map(
      saved.map(
        (id,index) =>
          [
            String(id),
            index
          ]
      )
    );

  return [...items].sort(
    (a,b) => {

      const pa =
        position.has(String(a.id))
          ? position.get(String(a.id))
          : 999999;

      const pb =
        position.has(String(b.id))
          ? position.get(String(b.id))
          : 999999;

      return pa - pb;

    }
  );

}


/* =========================================================
   HEADING
   ========================================================= */

function renderHeading(){

  if(
    activeSectionId === null
  ){

    $("heading").innerHTML = "";

    return;

  }

  const section =
    sections.find(
      x => x.id === activeSectionId
    );

  if(!section){

    activeSectionId = null;

    renderHeading();

    return;

  }

  $("heading").innerHTML = "";

  const h =

/* =========================================================

   ========================================================= */

function renderSections(){

  const nav =
    $("sectionsNav");

  nav.innerHTML = "";


  /* ALL MEMORIES */

  const all =
    document.createElement("div");

  all.className =
    "tab" +
    (
      activeSectionId === null
        ? " active"
        : ""
    );

  const allBtn =
    document.createElement("button");

  allBtn.textContent =
    "all memories ♡";

  allBtn.addEventListener(
    "click",
    async () => {

      activeSectionId = null;

      renderSections();

      await loadGallery();

      recordVisitor();

    }
  );

  all.appendChild(allBtn);

  nav.appendChild(all);


  /* REAL SECTIONS */

  sections.forEach(
    section => {

      const wrap =
        document.createElement("div");

      wrap.className =
        "tab" +
        (
          activeSectionId === section.id
            ? " active"
            : ""
        );

      wrap.dataset.sectionId =
        section.id;


      const pick =
        document.createElement("button");

      pick.textContent =
        section.title;

      pick.addEventListener(
        "click",
        async () => {

          activeSectionId =
            section.id;

          renderSections();

          await loadGallery();

          recordVisitor();

        }
      );

      wrap.appendChild(pick);


      const rem =
        document.createElement("button");

      rem.className =
        "remove-section";

      rem.type = "button";

      rem.title =
        "Remove section";

      rem.textContent =
        "×";

      rem.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          removeSection(section);

        }
      );

      wrap.appendChild(rem);

      nav.appendChild(wrap);

    }
  );

  updateAdminUI();

}

/* =========================================================
   LOAD SECTIONS
   ========================================================= */

async function loadSections(){

  const {
    data,
    error
  } =
    await db
      .from(SECTIONS_TABLE)
      .select(
        "id,title,subtitle,created_at"
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "Sections:",
      error
    );

    sections = [];

  }else{

    sections =
      data || [];

  }


  sections =
    applySavedOrder(
      sections,
      "sections",
      "main"
    );


  renderSections();

  populateSectionSelect();

  renderHeading();

}


/* =========================================================
   LOAD GALLERY
   ========================================================= */

async function loadGallery(){

  renderHeading();


  const gallery =
    $("gallery");

  gallery.innerHTML =
    '<div class="empty">loading memories ♡</div>';


  let query =
    db
      .from(MEMORIES_TABLE)
      .select("*");


  if(
    activeSectionId !== null
  ){

    query =
      query.eq(
        "section_id",
        activeSectionId
      );

  }


  const {
    data,
    error
  } =
    await query;


  if(error){

    console.error(
      "Gallery:",
      error
    );

    gallery.innerHTML =
      '<div class="empty">couldn\'t load memories ♡</div>';

    return;

  }


  let rows =
    sortMemories(
      data || []
    );


  rows =
    applySavedOrder(
      rows,
      "memories",
      activeSectionId
    );


  gallery.innerHTML = "";


  if(!rows.length){

    gallery.innerHTML =
      '<div class="empty">no memories here yet ♡</div>';

    return;

  }


  rows.forEach(
    memory => {

      const card =
        document.createElement("article");

      card.className =
        "card";

      card.dataset.memoryId =
        memory.id;


      const media =
        document.createElement("div");

      media.className =
        "media";


      const url =
        publicUrl(
          memory.file_path
        );


      const isVideo =
        memory.type === "video" ||
        /\.(mp4|webm|ogg|mov)(\?|$)/i.test(
          memory.file_path || ""
        );


      if(isVideo){

        const video =
          document.createElement("video");

        video.src = url;

        video.controls = true;

        video.preload = "metadata";

        video.playsInline = true;

        media.appendChild(video);

      }else{

        const img =
          document.createElement("img");

        img.src = url;

        img.loading = "lazy";

        img.decoding = "async";

        img.alt =
          memory.caption ||
          "Memory photo";

        img.addEventListener(
          "click",
          () =>
            openLightbox(
              memory,
              false
            )
        );

        media.appendChild(img);

      }


      card.appendChild(media);


      const info =
        document.createElement("div");

      info.className =
        "info";


      if(memory.date){

        const date =
          document.createElement("div");

        date.className =
          "date";

        date.textContent =
          formatDate(
            memory.date
          );

        info.appendChild(date);

      }


      if(memory.location){

        const location =
          document.createElement("div");

        location.className =
          "location";

        location.textContent =
          "📍 " +
          memory.location;

        info.appendChild(location);

      }


      if(memory.caption){

        const caption =
          document.createElement("div");

        caption.className =
          "caption";

        caption.textContent =
          memory.caption;

        info.appendChild(caption);

      }


      if(info.children.length){

        card.appendChild(info);

      }


      /* BASIC DELETE */

      if(admin()){

        const actions =
          document.createElement("div");

        actions.className =
          "card-actions";


        const del =
          document.createElement("button");

        del.className =
          "delete-memory";

        del.textContent =
          "delete";

        del.addEventListener(
          "click",
          () =>
            deleteMemory(memory)
        );


        actions.appendChild(del);

        card.appendChild(actions);

      }


      gallery.appendChild(card);

    }
  );


  if(admin()){

    setTimeout(
      addMemoryTools,
      20
    );

  }

}


/* =========================================================
   DELETE MEMORY
   ========================================================= */

async function deleteMemory(memory){

  if(!admin()) return;


  if(
    !confirm(
      "Delete this memory and its stored file?"
    )
  ){

    return;

  }


  const {
    error
  } =
    await db
      .from(MEMORIES_TABLE)
      .delete()
      .eq(
        "id",
        memory.id
      );


  if(error){

    alert(
      "Couldn't delete the memory ♡\n\n" +
      error.message
    );

    return;

  }


  if(memory.file_path){

    const result =
      await db
        .storage
        .from(STORAGE_BUCKET)
        .remove([
          memory.file_path
        ]);

    if(result.error){

      console.error(
        "Storage delete:",
        result.error
      );

    }

  }


  await loadGallery();

}


/* =========================================================
   DELETE SECTION
   ========================================================= */

async function removeSection(section){

  if(!admin()) return;


  if(
    !confirm(
      `Remove "${section.title}"?\n\n` +
      "Its memories will be kept and moved to All Memories."
    )
  ){

    return;

  }


  const moved =
    await db
      .from(MEMORIES_TABLE)
      .update({
        section_id:null
      })
      .eq(
        "section_id",
        section.id
      );


  if(moved.error){

    alert(
      "Couldn't move the memories.\n\n" +
      moved.error.message
    );

    return;

  }


  const removed =
    await db
      .from(SECTIONS_TABLE)
      .delete()
      .eq(
        "id",
        section.id
      );


  if(removed.error){

    alert(
      "Couldn't remove the section.\n\n" +
      removed.error.message
    );

    return;

  }


  if(
    activeSectionId === section.id
  ){

    activeSectionId = null;

  }


  await loadSections();

  await loadGallery();

}

$("saveMemory")
  .addEventListener(
    "click",
    async () => {

      if(!admin()) return;


      const file =
        $("memoryFile")
          .files[0];


      if(!file){

        alert(
          "Please choose a photo or video ♡"
        );

        return;

      }


      const button =
        $("saveMemory");

      button.disabled =
        true;

      button.textContent =
        "saving... ♡";


      const sectionId =
        $("memorySection")
          .value ||
        null;

      const date =
        $("memoryDate")
          .value ||
        null;

      const location =
        $("memoryLocation")
          .value
          .trim();

      const caption =
        $("memoryCaption")
          .value
          .trim();


      const type =
        file.type.startsWith(
          "video/"
        )
          ? "video"
          : "image";


      const safeName =
        file.name
          .normalize("NFKD")
          .replace(
            /[^\w.\- ]/g,
            ""
          )
          .replace(
            /\s+/g,
            "-"
          );


      const path =
        `uploads/${crypto.randomUUID()}-${safeName}`;


      const upload =
        await db
          .storage
          .from(STORAGE_BUCKET)
          .upload(
            path,
            file,
            {
              contentType:
                file.type,
              cacheControl:
                "3600",
              upsert:false
            }
          );


      if(upload.error){

        alert(
          "Upload failed ♡\n\n" +
          upload.error.message
        );

        button.disabled =
          false;

        button.textContent =
          "add memory ♡";

        return;

      }


      const insert =
        await db
          .from(MEMORIES_TABLE)
          .insert({
            file_path:path,
            type,
            section_id:sectionId,
            date,
            location:
              location || null,
            caption:
              caption || null
          });


      if(insert.error){

        await db
          .storage
          .from(STORAGE_BUCKET)
          .remove([
            path
          ]);

        alert(
          "Couldn't save the memory ♡\n\n" +
          insert.error.message
        );

        button.disabled =
          false;

        button.textContent =
          "add memory ♡";

        return;

      }


      $("memoryFile")
        .value = "";

      $("memorySection")
        .value = "";

      $("memoryDate")
        .value = "";

      $("memoryLocation")
        .value = "";

      $("memoryCaption")
        .value = "";


      button.disabled =
        false;

      button.textContent =
        "add memory ♡";


      closeModal(
        "memoryModal"
      );


      await loadGallery();

    }
  );

/* =========================================================
   EDIT POPUP
   ========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    character =>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[character])
  );

}


function showEditBox(
  title,
  fields,
  saveFunction
){

  document
    .getElementById(
      "extraEditBox"
    )
    ?.remove();


  const overlay =
    document.createElement(
      "div"
    );

  overlay.id =
    "extraEditBox";

  overlay.className =
    "open";


  let fieldsHtml =
    "";


  fields.forEach(
    field => {

      if(
        field.type ===
        "textarea"
      ){

        fieldsHtml += `
          <label>${escapeHtml(field.label)}</label>
          <textarea id="extraField_${escapeHtml(field.key)}">${escapeHtml(field.value || "")}</textarea>
        `;

      }else{

        fieldsHtml += `
          <label>${escapeHtml(field.label)}</label>
          <input
            id="extraField_${escapeHtml(field.key)}"
            type="${escapeHtml(field.type || "text")}"
            value="${escapeHtml(field.value || "")}"
          >
        `;

      }

    }
  );


  overlay.innerHTML = `
    <div class="extra-edit-card">

      <h2>${escapeHtml(title)}</h2>

      <p>edit this little detail ♡</p>

      ${fieldsHtml}

      <div class="extra-edit-buttons">

        <button id="extraCancel">
          cancel
        </button>

        <button
          class="save-extra"
          id="extraSave"
        >
          save ♡
        </button>

      </div>

    </div>
  `;


  document.body.appendChild(
    overlay
  );


  function close(){

    overlay.remove();

  }


  overlay
    .querySelector(
      "#extraCancel"
    )
    .onclick = close;


  overlay.addEventListener(
    "click",
    event => {

      if(
        event.target ===
        overlay
      ){

        close();

      }

    }
  );


  overlay
    .querySelector(
      "#extraSave"
    )
    .onclick =
      async () => {

        const values = {};


        fields.forEach(
          field => {

            values[field.key] =
              document
                .getElementById(
                  "extraField_" +
                  field.key
                )
                .value;

          }
        );


        const button =
          overlay.querySelector(
            "#extraSave"
          );

        button.disabled =
          true;

        button.textContent =
          "saving...";


        try{

          await saveFunction(
            values
          );

          close();

          await loadSections();

          await loadGallery();

        }catch(error){

          console.error(error);

          alert(
            "Couldn't save the changes ♡\n\n" +
            (
              error.message ||
              error
            )
          );

          button.disabled =
            false;

          button.textContent =
            "save ♡";

        }

      };

}

async function getCurrentMemories(){

  let query =
    db
      .from(MEMORIES_TABLE)
      .select("*");


  if(
    activeSectionId !== null
  ){

    query =
      query.eq(
        "section_id",
        activeSectionId
      );

  }


  const result =
    await query;


  if(result.error)
    throw result.error;


  let rows =
    result.data || [];


  rows =
    sortMemories(
      rows
    );


  rows =
    applySavedOrder(
      rows,
      "memories",
      activeSectionId
    );


  return rows;

}


async function addMemoryTools(){

  if(!admin()) return;


  const gallery =
    $("gallery");


  if(!gallery) return;


  let memories;


  try{

    memories =
      await getCurrentMemories();

  }catch(error){

    console.error(
      "Memory tools:",
      error
    );

    return;

  }


  const cards =
    [
      ...gallery
        .querySelectorAll(
          ".card"
        )
    ];


  cards.forEach(
    (card,index) => {

      const memory =
        memories[index];


      if(!memory)
        return;


      card.dataset.memoryId =
        memory.id;

      card.draggable =
        true;


      if(
        !card.querySelector(
          ".extra-memory-tools"
        )
      ){

        const tools =
          document.createElement(
            "div"
          );

        tools.className =
          "extra-memory-tools";


        const editButton =
          document.createElement(
            "button"
          );

        editButton.type =
          "button";

        editButton.className =
          "extra-edit-memory";

        editButton.textContent =
          "✏️ edit";


        const deleteButton =
          document.createElement(
            "button"
          );

        deleteButton.type =
          "button";

        deleteButton.className =
          "extra-delete-memory";

        deleteButton.textContent =
          "🗑️ delete";


        editButton.onclick =
          event => {

            event.stopPropagation();

            editMemory(
              memory
            );

          };


        deleteButton.onclick =
          async event => {

            event.stopPropagation();

            await deleteMemory(
              memory
            );

          };


        tools.appendChild(
          editButton
        );

        tools.appendChild(
          deleteButton
        );

        card.appendChild(
          tools
        );

      }


      card.addEventListener(
        "dragstart",
        () => {

          card.classList.add(
            "memory-dragging"
          );

        }
      );


      card.addEventListener(
        "dragend",
        () => {

          card.classList.remove(
            "memory-dragging"
          );


          const orderedIds =
            [
              ...gallery
                .querySelectorAll(
                  ".card[data-memory-id]"
                )
            ].map(
              item =>
                item.dataset.memoryId
            );


          saveOrder(
            "memories",
            activeSectionId,
            orderedIds
          );

        }
      );


      card.addEventListener(
        "dragover",
        event => {

          event.preventDefault();


          const dragging =
            gallery.querySelector(
              ".memory-dragging"
            );


          if(
            !dragging ||
            dragging === card
          ){

            return;

          }


          const rect =
            card.getBoundingClientRect();


          const before =
            event.clientY <
            rect.top +
            rect.height / 2;


          if(before){

            gallery.insertBefore(
              dragging,
              card
            );

          }else{

            gallery.insertBefore(
              dragging,
              card.nextSibling
            );

          }

        }
      );

    }
  );

}


/* =========================================================
   SECTION ADMIN TOOLS
   ========================================================= */

function saveCurrentSectionOrder(){

  const nav =
    $("sectionsNav");


  const ids =
    [
      ...nav.querySelectorAll(
        ".tab[data-section-id]"
      )
    ].map(
      tab =>
        tab.dataset.sectionId
    );


  saveOrder(
    "sections",
    "main",
    ids
  );

}


function addSectionTools(){

  if(!admin()) return;


  const nav =
    $("sectionsNav");


  if(!nav) return;


  const tabs =
    [
      ...nav.querySelectorAll(
        ".tab[data-section-id]"
      )
    ];


  tabs.forEach(
    tab => {

      const section =
        sections.find(
          item =>
            String(item.id) ===
            String(
              tab.dataset.sectionId
            )
        );


      if(!section)
        return;


      tab.draggable =
        true;


      if(
        tab.querySelector(
          ".extra-section-tools"
        )
      ){

        return;

      }


      const tools =
        document.createElement(
          "span"
        );

      tools.className =
        "extra-section-tools";


      const left =
        document.createElement(
          "button"
        );

      left.type =
        "button";

      left.title =
        "move left";

      left.textContent =
        "←";


      const right =
        document.createElement(
          "button"
        );

      right.type =
        "button";

      right.title =
        "move right";

      right.textContent =
        "→";


      const edit =
        document.createElement(
          "button"
        );

      edit.type =
        "button";

      edit.title =
        "edit";

      edit.textContent =
        "✏️";


      left.onclick =
        event => {

          event.stopPropagation();

          const index =
            [
              ...nav.querySelectorAll(
                ".tab[data-section-id]"
              )
            ].indexOf(tab);


          if(index <= 0)
            return;


          const tabs =
            [
              ...nav.querySelectorAll(
                ".tab[data-section-id]"
              )
            ];


          nav.insertBefore(
            tab,
            tabs[index - 1]
          );


          saveCurrentSectionOrder();

        };


      right.onclick =
        event => {

          event.stopPropagation();

          const tabs =
            [
              ...nav.querySelectorAll(
                ".tab[data-section-id]"
              )
            ];


          const index =
            tabs.indexOf(tab);


          if(
            index < 0 ||
            index >=
              tabs.length - 1
          ){

            return;

          }


          nav.insertBefore(
            tabs[index + 1],
            tab
          );


          saveCurrentSectionOrder();

        };


      edit.onclick =
        event => {

          event.stopPropagation();

          editSection(
            section
          );

        };


      tools.appendChild(
        left
      );

      tools.appendChild(
        right
      );

      tools.appendChild(
        edit
      );

      tab.appendChild(
        tools
      );


      tab.addEventListener(
        "dragstart",
        () => {

          tab.classList.add(
            "section-dragging"
          );

        }
      );


      tab.addEventListener(
        "dragend",
        () => {

          tab.classList.remove(
            "section-dragging"
          );

          saveCurrentSectionOrder();

        }
      );


      tab.addEventListener(
        "dragover",
        event => {

          event.preventDefault();


          const dragging =
            nav.querySelector(
              ".section-dragging"
            );


          if(
            !dragging ||
            dragging === tab
          ){

            return;

          }


          const rect =
            tab.getBoundingClientRect();


          const before =
            event.clientX <
            rect.left +
            rect.width / 2;


          if(before){

            nav.insertBefore(
              dragging,
              tab
            );

          }else{

            nav.insertBefore(
              dragging,
              tab.nextSibling
            );

          }

        }
      );

    }
  );

}


/* =========================================================
   AUTH STATE
   ========================================================= */

db.auth.onAuthStateChange(
  async (_event,session) => {

    currentUser =
      session?.user || null;


    if(
      currentUser &&
      currentUser.id !== ADMIN_UID
    ){

      currentUser =

    }


    updateAdminUI();

    renderSections();


    if(admin()){

    }else{

      stopPresenceHeartbeat();

      updatePresence();

    }


    if(admin()){

      setTimeout(
        () => {

          addMemoryTools();

          addSectionTools();

        },
        100
      );

    }

  }
);


/* =========================================================
   PRESENCE
   ========================================================= */

const PRESENCE_ID =
  "lyss";

const ONLINE_TIME =
  90000;

const PRESENCE_HEARTBEAT =
  30000;

let presenceTimer =
  null;


function setOnline(){

  const presence =
    $("lyss-presence");

  const heart =
    $("lyss-heart");

  const text =
    $("lyss-presence-text");


  presence.className =
    "online";

  heart.textContent =
    "♥";

  text.textContent =
    "lyss is online";

}


function setOffline(
  lastSeen
){

  const presence =
    $("lyss-presence");

  const heart =
    $("lyss-heart");

  const text =
    $("lyss-presence-text");


  presence.className =
    "offline";

  heart.textContent =
    "♡";


  if(!lastSeen){

    text.textContent =
      "lyss was last active…";

    return;

  }


  const seconds =
    Math.max(
      0,
      Math.floor(
        (
          Date.now() -
          new Date(lastSeen).getTime()
        ) / 1000
      )
    );


  if(seconds < 60){

    text.textContent =
      "lyss was last active just now";

    return;

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes === 1){

    text.textContent =
      "lyss was last active 1 minute ago";

    return;

  }


  if(minutes < 60){

    text.textContent =
      `lyss was last active ${minutes} minutes ago`;

    return;

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours === 1){

    text.textContent =
      "lyss was last active 1 hour ago";

    return;

  }


  if(hours < 24){

    text.textContent =
      `lyss was last active ${hours} hours ago`;

    return;

  }


  const days =
    Math.floor(
      hours / 24
    );


  text.textContent =
    days === 1
      ? "lyss was last active 1 day ago"
      : `lyss was last active ${days} days ago`;

}


async function updatePresence(){

  try{

    const {
      data,
      error
    } =
      await db
        .from("admin_presence")
        .select(
          "last_seen"
        )
        .eq(
          "id",
          PRESENCE_ID
        )
        .maybeSingle();


    if(error){

      console.error(
        "Presence read:",
        error
      );

      setOffline(null);

      return;

    }


    if(
      !data ||
      !data.last_seen
    ){

      setOffline(null);

      return;

    }


    const lastSeen =
      new Date(
        data.last_seen
      ).getTime();


    const online =
      Date.now() -
      lastSeen <=
      ONLINE_TIME;


    if(online){

      setOnline();

    }else{

      setOffline(
        data.last_seen
      );

    }

  }catch(error){

    console.error(
      "Presence:",
      error
    );

    setOffline(null);

  }

}


async function heartbeat(){

  try{

    const {
      data
    } =
      await db.auth.getSession();


    const user =
      data?.session?.user;


    if(
      !user ||
      user.id !== ADMIN_UID
    ){

      return;

    }


    const result =
      await db
        .from("admin_presence")
        .upsert(
          {
            id:PRESENCE_ID,
            last_seen:
              new Date().toISOString()
          },
          {
            onConflict:"id"
          }
        );


    if(result.error){

      console.error(
        "Presence heartbeat:",
        result.error
      );

      return;

    }


    setOnline();

  }catch(error){

    console.error(
      "Heartbeat:",
      error
    );

  }

}


function startPresenceHeartbeat(){

  if(presenceTimer)
    return;


  heartbeat();


  presenceTimer =
    setInterval(
      heartbeat,
      PRESENCE_HEARTBEAT
    );

}


function stopPresenceHeartbeat(){

  if(
    presenceTimer
  ){

    clearInterval(
      presenceTimer
    );

    presenceTimer =
      null;

  }

}


/* =========================================================
   VISITOR TRACKING
   ========================================================= */

const VISITOR_KEY =
  "lyss_gallery_visitor_id";

const SESSION_KEY =
  "lyss_gallery_session_id";


let visitorId =
  localStorage.getItem(
    VISITOR_KEY
  );


if(!visitorId){

  visitorId =
    crypto.randomUUID();

  localStorage.setItem(
    VISITOR_KEY,
    visitorId
  );

}


let sessionId =
  sessionStorage.getItem(
    SESSION_KEY
  );


if(!sessionId){

  sessionId =
    crypto.randomUUID();

  sessionStorage.setItem(
    SESSION_KEY,
    sessionId
  );

}


async function recordVisitor(){

  try{

    const now =
      new Date().toISOString();


    const section =
      activeSectionId;


    await db
      .from("gallery_visitors")
      .upsert(
        {
          visitor_id:
            visitorId,

          last_seen:
            now
        },
        {
          onConflict:
            "visitor_id"
        }
      );


    const {
      data:existing
    } =
      await db
        .from("gallery_sessions")
        .select(
          "id,started_at,sections_visited"
        )
        .eq(
          "id",
          sessionId
        )
        .maybeSingle();


    if(existing){

      const visited =
        Array.isArray(
          existing.sections_visited
        )
          ? [
              ...existing.sections_visited
            ]
          : [];


      if(
        section &&
        !visited.includes(
          section
        )
      ){

        visited.push(
          section
        );

      }


      await db
        .from("gallery_sessions")
        .update({
          last_seen:
            now,

          current_section_id:
            section,

          sections_visited:
            visited,

          ended_at:null
        })
        .eq(
          "id",
          sessionId
        );

    }else{

      await db
        .from("gallery_sessions")
        .insert({
          id:
            sessionId,

          visitor_id:
            visitorId,

          started_at:
            now,

          last_seen:
            now,

          current_section_id:
            section,

          sections_visited:
            section
              ? [section]
              : [],

          ended_at:null
        });

    }

  }catch(error){

    /*
      Visitor tracking should NEVER
      break the gallery if its table
      or RLS is unavailable.
    */

    console.warn(
      "Visitor tracking:",
      error
    );

  }

}


/* =========================================================
   VISITOR HEARTBEAT
   ========================================================= */

setInterval(
  () => {

    recordVisitor();

  },
  30000
);


/* =========================================================
   END SESSION
   ========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(!sessionId)
      return;


    /*
      This is intentionally best-effort.
    */

    db
      .from("gallery_sessions")
      .update({
        ended_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        sessionId
      );

  }
);


/* =========================================================
   START
   ========================================================= */

(async function start(){

  try{

    const {
      data
    } =
      await db.auth.getSession();


    currentUser =
      data.session?.user ||
      null;


    if(
      currentUser &&
      currentUser.id !== ADMIN_UID
    ){

      await db.auth.signOut();

      currentUser =
        null;

    }


    updateAdminUI();


    await loadSections();

    await loadGallery();


    recordVisitor();


    if(admin()){

      startPresenceHeartbeat();

    }


    updatePresence();


    setTimeout(
      () => {

        if(admin()){

          addMemoryTools();

          addSectionTools();

        }

      },
      200
    );


  }catch(error){

    console.error(
      "Startup:",
      error
    );


    $("gallery").innerHTML =
      '<div class="empty">couldn\'t load memories ♡</div>';

  }

})();

);

setInterval(

    if(admin()){

      addMemoryTools();

      addSectionTools();

  },
  3000
);
